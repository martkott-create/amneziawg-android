name: Build AmneziaWG Tunnel AAR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build tunnel library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build tunnel AAR
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :tunnel:assembleRelease

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-tunnel-aar
          path: tunnel/build/outputs/aar/tunnel-release.aar
          if-no-files-found: error
